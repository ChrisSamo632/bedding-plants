minimum_pre_commit_version: 4.3.0

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
      - id: check-json
        exclude: ^\.vscode/
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^mvnw\.cmd$
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: local
    hooks:
      - id: betterleaks-system
        name: Detect hardcoded secrets
        description: Detect hardcoded secrets using Betterleaks
        entry: bash -o pipefail -c 'betterleaks stdin --redact'
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        description: Test shell scripts with shellcheck
        entry: shellcheck
        language: python
        types: [shell]
        require_serial: true # shellcheck can detect sourcing this way
        files: ^run-local\.sh$

  - repo: local
    hooks:
      - id: maven-build-and-test
        name: Maven build and test
        entry: ./mvnw -B -ntp verify
        language: system
        pass_filenames: false
        files: ^(pom\.xml|src/.*)$
